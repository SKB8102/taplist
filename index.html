<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taproom TV Tap List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: a fixed 1920×1080 TV "stage" scaled to fit any screen. "ON TAP" runs up a
     narrow rail on the left; two columns of tap rows fill the rest, with a promo band and a
     status line underneath. */
  :root {
    --ink: #121417;          /* background */
    --panel: #1b1e23;        /* tap row */
    --bone: #efe9dc;         /* primary text */
    --muted: #9a958b;        /* secondary text (style line, labels) */
    --divider: rgba(239, 233, 220, .28);  /* lines around the 10oz column — raise .28 for stronger, lower for fainter */
    --style: #cbc5b8;        /* style line: lighter than before, still softer than the white name */
    --brass: #61A19B;        /* accent: tap numbers, ON TAP TODAY, size headers, to-go chips */
    --line: #2c3037;         /* dividers */
    --na: #c9b6e4;           /* non-alcoholic marker (kept clearly different from the teal accent) */
    --guest: #f0a04b;        /* guest tap stripe + chip */
    --band: #6e2a2a;         /* promo band background */
    --skull: #efe9dc;        /* skull logo color (bone/white). Try #61A19B for teal */
    --price-size: 33px;      /* price numbers (was 38px). Size headers scale with it */
    --price-col: 230px;      /* width of the 3 price columns (was 270px); the rest goes to name/style */
    --rail-size: 99px;       /* ON TAP TODAY size — change this one number */
    --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
    --body: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); overflow: hidden; }
  body { color: var(--bone); font-family: var(--body); }

  .stage {
    position: absolute; top: 50%; left: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    display: grid; grid-template-columns: 108px 1fr;
    column-gap: 34px;
    padding: 30px 56px 30px 36px;
  }

  /* Left rail: [skull] ON TAP TODAY [skull] as one row, rotated to read bottom-to-top, centered */
  .rail { position: relative; border-right: 3px solid var(--brass); min-height: 0; overflow: hidden; }
  .railrow {
    position: absolute; top: 50%; left: calc(50% - 11px);
    transform: translate(-50%, -50%) rotate(-90deg);
    display: flex; align-items: center; gap: .3em; white-space: nowrap;
    font-size: var(--rail-size);
  }
  .offline { position: absolute; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%; background: #e0443e; box-shadow: 0 0 10px #e0443e; display: none; z-index: 2; }
  .offline.on { display: block; }
  .skull { height: .82em; width: auto; color: var(--skull); flex: none; display: block; }
  .ontap {
    font-family: var(--display); font-weight: 900; font-size: 1em; line-height: .8;
    letter-spacing: 4px; text-transform: uppercase; white-space: nowrap;
  }
  .ontap span { color: var(--brass); }

  .content { display: grid; grid-template-rows: 1fr auto; gap: 14px; min-height: 0; }

  /* 14 lines max → 7 rows per column. Empty lines are skipped; rows keep their size.
     If more than 14 ever come through, --rows grows and everything shrinks to fit. */
  /* --s scales the rows' text: 1 at 7 rows per column, bigger with fewer beers, smaller past 14 */
  main { --rows: 7; --s: 1; display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; min-height: 0; }
  .col { display: grid; grid-template-rows: auto 1fr; gap: 8px; min-height: 0; }
  .list { display: grid; grid-template-rows: repeat(var(--rows), 1fr); row-gap: 10px; min-height: 0; }
  /* Pour sizes sit directly above each column's prices, using the same grid as a tap row */
  .colhead { display: grid; grid-template-columns: calc(70px * var(--s)) 1fr calc(var(--price-col) * var(--s)); column-gap: 16px; padding: 0 20px 6px 19px; border-bottom: 1px solid var(--line); }
  .colhead .sizes { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-family: var(--display); font-weight: 800; font-size: calc(var(--price-size) * .78 * var(--s)); letter-spacing: 1.5px; color: var(--brass); text-transform: uppercase; }

  .tap {
    background: var(--panel); border-radius: 6px;
    display: grid; grid-template-columns: calc(70px * var(--s)) 1fr calc(var(--price-col) * var(--s)); align-items: center;
    column-gap: 16px; padding: 6px 20px 6px 14px; min-height: 0;
    border-left: 5px solid transparent;
  }
  .tap.guest { border-left-color: var(--guest); }
  .tap.na    { border-left-color: var(--na); }
  .num { font-family: var(--display); font-weight: 900; font-size: calc(64px * var(--s)); color: var(--brass); text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
  .info { min-width: 0; display: grid; gap: 3px; }
  /* Line 1: Beer Name • ABV */
  .name { display: flex; align-items: baseline; min-width: 0; font-family: var(--display); font-weight: 800; font-size: calc(42px * var(--s)); line-height: 1; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  .name .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* only the name shortens; ABV always shows */
  .name .dot, .name .abv { flex: none; }
  .name .dot { color: var(--brass); margin: 0 12px; }
  .name .abv { font-variant-numeric: tabular-nums; }
  /* Line 2: Style — larger, same muted color */
  .style { font-size: calc(32px * var(--s)); line-height: 1.05; color: var(--style); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 8px; margin-top: 3px; flex-wrap: nowrap; }
  .chip { font-size: calc(16px * var(--s)); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 1px 9px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.can { color: var(--ink); background: var(--brass); border-color: var(--brass); }
  .chip.na  { color: var(--ink); background: var(--na); border-color: var(--na); }
  .chip.guest { color: var(--guest); border-color: var(--guest); }

  .prices { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-variant-numeric: tabular-nums; }
  .price { font-size: calc(var(--price-size) * var(--s)); font-weight: 700; line-height: 1; }
  .price.none { color: var(--line); }
  /* Faint lines either side of the 10oz column (rows + headers) to separate the prices */
  .prices > :nth-child(2), .colhead .sizes > :nth-child(2) { border-left: 2px solid var(--divider); border-right: 2px solid var(--divider); }

  .band {
    background: var(--band); border-radius: 6px; padding: 12px 24px;
    font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: 3px;
    text-transform: uppercase; text-align: center; color: var(--bone);
  }

</style>
</head>

<script>
/*
 * Data source:
 *  - Served by the Apps Script web app → uses google.script.run (no setup needed).
 *  - Hosted anywhere else → set FEED_URL to your web app URL + "?format=json".
 */
const FEED_URL = 'https://script.google.com/macros/s/AKfycbzU1AsYafuM5jylKOKl3nuUf3PsxSJZxPFNCQBUbylOUlDb613sGohvc7BOqD5TWaiKkw/exec';            // e.g. 'https://script.google.com/macros/s/XXXX/exec'  (no ?format)
const CHECK_MS = 15000;         // how often to ask "did anything change?" (cheap)
const SAFETY_MS = 10 * 60000;   // reload the list anyway every 10 min, just in case

let lastOk = null, lastVersion = null, lastFull = 0;

let SCALE = 1;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(data) {
  const taps = (data && data.taps) || [];
  const el = document.getElementById('taps');
  // Fewer beers → fewer, taller rows and bigger text (12 beers = 2 columns of 6).
  // Never fewer than 4 rows, and text grows at most 35% so it doesn't get silly with 3 beers.
  const rows = Math.max(4, Math.ceil(taps.length / 2));
  const scale = Math.min(1.35, 7 / rows);
  el.style.setProperty('--rows', rows);
  el.style.setProperty('--s', scale);
  SCALE = scale;
  const row = t => {
    const cls = ['tap', t.guest ? 'guest' : '', t.na ? 'na' : ''].join(' ').trim();
    const chips = [
      ...(t.na ? ['<span class="chip na">N/A</span>'] : []),
      ...(t.guest ? [`<span class="chip guest">Guest · ${esc(t.guest)}</span>`] : []),
      ...(t.togo || []).map(x => `<span class="chip can">${esc(x)}</span>`),
    ].join('');
    const p = v => v ? `<div class="price">${esc(v)}</div>` : '<div class="price none" aria-label="not poured">—</div>';
    return `<article class="${cls}">
      <div class="num">${esc(t.line)}</div>
      <div class="info">
        <div class="name"><span class="nm">${esc(t.name)}</span>${t.abv ? `<span class="dot">•</span><span class="abv">${esc(t.abv)}</span>` : ''}</div>
        <div class="style">${esc(t.style)}</div>
        ${chips ? `<div class="chips">${chips}</div>` : ''}
      </div>
      <div class="prices">${p(t.p16)}${p(t.p10)}${p(t.p5)}</div>
    </article>`;
  };
  const head = '<div class="colhead"><span></span><span></span><div class="sizes"><span>16oz</span><span>10oz</span><span>5oz</span></div></div>';
  const col = list => `<section class="col">${head}<div class="list">${list.map(row).join('')}</div></section>`;
  el.innerHTML = col(taps.slice(0, rows)) + col(taps.slice(rows));
  requestAnimationFrame(fitNames);
  setTimeout(fitNames, 300);
  lastOk = new Date();
  setStatus();
}

function setStatus(err) {
  const dot = document.getElementById('offline');
  if (dot) dot.classList.toggle('on', !!err);   // red dot only while offline
}

const viaApps = () => typeof google !== 'undefined' && google.script && google.script.run;

function loadTaps() {
  lastFull = Date.now();
  if (viaApps()) {
    google.script.run.withSuccessHandler(render).withFailureHandler(() => setStatus(true)).getTvTaps();
  } else if (FEED_URL) {
    fetch(FEED_URL + '?format=json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => setStatus(true));      // keep showing the last good list
  } else {
    (document.getElementById('status') || {}).textContent = 'Set FEED_URL in this page';
  }
}

function onVersion(v) {
  setStatus(false);
  const changed = lastVersion !== null && v !== lastVersion;
  lastVersion = v;
  if (changed || Date.now() - lastFull > SAFETY_MS) loadTaps();
}

function check() {
  if (viaApps()) {
    google.script.run.withSuccessHandler(onVersion).withFailureHandler(() => setStatus(true)).getTvVersion();
  } else if (FEED_URL) {
    fetch(FEED_URL + '?format=version', { cache: 'no-store' })
      .then(r => r.json()).then(d => onVersion(d.version))
      .catch(() => setStatus(true));
  }
}

/**
 * Long names / styles: shrink that one line's font until the whole text fits, instead of "…".
 * Measures the real text width (a Range over the text) against the space it has, with a
 * small safety margin — scrollWidth alone misses overflows of a pixel or less, which still
 * trigger the "…".
 */
function textWidth(el) {
  const r = document.createRange();
  r.selectNodeContents(el);
  return r.getBoundingClientRect().width;
}
function shrinkToFit(textEl, sizeEl, start, min) {
  let size = start;
  sizeEl.style.fontSize = size + 'px';
  while (textWidth(textEl) > textEl.getBoundingClientRect().width - 2 && size > min) {
    size -= 1;
    sizeEl.style.fontSize = size + 'px';
  }
}
function fitNames() {
  document.querySelectorAll('.name').forEach(n => {
    // Let the name take its full natural width while measuring, then check whether the
    // end of the line (the ABV) runs past the row. Shrink until it doesn't.
    const nm = n.querySelector('.nm');
    if (!nm) return;
    nm.style.flexShrink = '0';
    let size = Math.round(42 * SCALE);
    n.style.fontSize = size + 'px';
    const over = () => n.lastElementChild.getBoundingClientRect().right > n.getBoundingClientRect().right - 2;
    while (over() && size > 20) { size -= 1; n.style.fontSize = size + 'px'; }
    nm.style.flexShrink = '';
  });
  document.querySelectorAll('.style').forEach(st => {
    shrinkToFit(st, st, Math.round(32 * SCALE), 18);          // style line, min 18px
  });
}

/** Shrink the skull + ON TAP TODAY row if it's longer than the rail is tall. */
function fitRail() {
  const row = document.getElementById('railrow'), rail = document.querySelector('.rail');
  if (!row || !rail) return;
  let size = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rail-size'), 10) || 99;
  row.style.fontSize = size + 'px';
  while (row.offsetWidth > rail.clientHeight - 40 && size > 50) { size -= 3; row.style.fontSize = size + 'px'; }
}

/**
 * Fit the 1920×1080 stage to the screen. TV browsers don't always agree on the screen size,
 * so take the SMALLEST width/height any of the APIs report (that's the part you can see).
 */
function viewportSize() {
  const vv = window.visualViewport;
  const ws = [window.innerWidth, document.documentElement.clientWidth, vv && vv.width].filter(x => x > 0);
  const hs = [window.innerHeight, document.documentElement.clientHeight, vv && vv.height].filter(x => x > 0);
  return { w: Math.min(...ws), h: Math.min(...hs) };
}
function fit() {
  const { w, h } = viewportSize();
  const s = Math.min(w / 1920, h / 1080);
  document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
  const dbg = document.getElementById('debug');
  if (dbg) {
    const vv = window.visualViewport;
    dbg.textContent = `inner ${innerWidth}×${innerHeight} · client ${document.documentElement.clientWidth}×${document.documentElement.clientHeight}` +
      ` · visual ${vv ? Math.round(vv.width) + '×' + Math.round(vv.height) : 'n/a'} · screen ${screen.width}×${screen.height}` +
      ` · dpr ${devicePixelRatio} · using ${w}×${h} · scale ${s.toFixed(3)}`;
  }
}

window.addEventListener('resize', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
// Some TV browsers settle their screen size a few seconds after loading — re-fit for a bit.
[250, 1000, 3000, 6000, 10000].forEach(ms => setTimeout(fit, ms));
// Add ?debug to the URL to show the screen sizes the TV reports (for troubleshooting).
if (/[?&]debug\b/.test(location.search)) {
  const d = document.createElement('div');
  d.id = 'debug';
  d.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;background:#000c;color:#0f0;font:16px monospace;padding:6px 10px;border-radius:4px;';
  document.body.appendChild(d);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitNames(); fitRail(); });
[500, 2000, 5000].forEach(ms => setTimeout(() => { fitNames(); fitRail(); }, ms));
fitRail();
fit();
loadTaps();
check();
setInterval(check, CHECK_MS);
// Full page reload every 6 hours so the TV never runs on a stale page for days
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
